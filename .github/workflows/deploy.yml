name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - agent
          - chat
          - auth
          - billing
          - gateway

concurrency:
  group: nexora-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Verify existing production setup
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" \
            'test -f "$HOME/app/.env" &&
             test -f "$HOME/app/docker-compose.prod.yml"'

      - name: Sync application files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='!.env.example' \
            --exclude='deploy-key.pem' \
            --exclude='*.backup' \
            --exclude='*.bak' \
            --exclude='audit-report.json' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='.DS_Store' \
            --exclude='docker-compose.prod.yml' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "ubuntu@$EC2_HOST:~/app/"

      - name: Deploy and verify production
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SERVICE: ${{ inputs.service }}
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd "$HOME/app"

            test -f .env
            test -f docker-compose.prod.yml

            sudo docker compose -f docker-compose.prod.yml config --quiet

            case "${SERVICE}" in
              all)
                sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
                ;;
              *)
                sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans "$SERVICE"
                ;;
            esac

            echo "Waiting for the API gateway to become healthy..."
            for attempt in $(seq 1 18); do
              if sudo docker compose -f docker-compose.prod.yml exec -T gateway node -e '
                const http = require("http");
                const req = http.get("http://127.0.0.1:8000/health", res => {
                  res.resume();
                  process.exit(res.statusCode === 200 ? 0 : 1);
                });
                req.setTimeout(3000, () => req.destroy(new Error("timeout")));
                req.on("error", () => process.exit(1));
              '; then
                echo "Gateway health check passed."
                break
              fi

              if [ "$attempt" -eq 18 ]; then
                echo "Gateway health check failed."
                sudo docker compose -f docker-compose.prod.yml ps
                sudo docker compose -f docker-compose.prod.yml logs --tail=100 gateway
                exit 1
              fi

              sleep 5
            done

            echo "Verifying every service health endpoint..."
            for service in auth chat agent billing; do
              port=8001
              case "$service" in
                chat) port=8002 ;;
                agent) port=8003 ;;
                billing) port=8004 ;;
              esac
              sudo docker compose -f docker-compose.prod.yml exec -T "$service" node -e "
                const http = require('http');
                const req = http.get('http://127.0.0.1:${port}/health', res => {
                  res.resume();
                  process.exit(res.statusCode === 200 ? 0 : 1);
                });
                req.setTimeout(3000, () => req.destroy(new Error('timeout')));
                req.on('error', () => process.exit(1));
              "
              echo "  $service healthy"
            done

            sudo docker compose -f docker-compose.prod.yml ps
          REMOTE
