name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            backend/gateway/package-lock.json
            backend/services/agent/package-lock.json
            backend/services/auth/package-lock.json
            backend/services/chat/package-lock.json
            backend/services/billing/package-lock.json

      - name: Install agent service dependencies
        run: npm ci --prefix backend/services/agent

      - name: Run agent unit tests
        run: npm test --prefix backend/services/agent

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Verify backend services start and expose health endpoints
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/nexora-ci
          REDIS_URL: redis://127.0.0.1:6379
          PORT: ""
          AUTH_SERVICE: http://127.0.0.1:8001
          CHAT_SERVICE: http://127.0.0.1:8002
          AGENT_SERVICE: http://127.0.0.1:8003
          BILLING_SERVICE: http://127.0.0.1:8004
          FRONTEND_URL: http://localhost:5173
        run: |
          set -euo pipefail

          # Redis backs the session store; the services fall back to a local
          # file store if it is unreachable, but we boot a real one so the
          # Redis code path is exercised.
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine

          # The shared/redis module lives outside every service folder, so
          # ioredis resolves from the backend workspace root.
          npm ci --omit=dev --no-audit --no-fund --prefix backend

          boot_service() {
            local name="$1" dir="$2" port="$3"
            echo "::group::Boot $name"
            (cd "$dir" && npm ci --omit=dev --no-audit --no-fund)
            (cd "$dir" && PORT="$port" node index.js > /tmp/"$name".log 2>&1 &)
            for attempt in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${port}/health" > /dev/null 2>&1; then
                curl -fsS "http://127.0.0.1:${port}/health"
                echo
                echo "::endgroup::"
                return 0
              fi
              sleep 2
            done
            echo "::endgroup::"
            echo "Service $name failed to boot:"
            cat /tmp/"$name".log
            exit 1
          }

          boot_service "gateway" backend/gateway 8000
          boot_service "auth" backend/services/auth 8001
          boot_service "chat" backend/services/chat 8002
          boot_service "agent" backend/services/agent 8003
          boot_service "billing" backend/services/billing 8004

          docker rm -f ci-redis || true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/gateway/Dockerfile
          push: false
          tags: multiagent-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Agent service image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/services/agent/Dockerfile
          push: false
          tags: multiagent-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: multiagent-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
