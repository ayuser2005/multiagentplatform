# ==============================================================================
# Nexora AI - Production stack
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All configuration comes from the environment (see .env.example).
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis - session store, rate limiting and conversation memory
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: multiagent-redis
    restart: always
    command: redis-server --save "" --appendonly no
    networks:
      - multiagent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Auth Service - Firebase authentication, sessions, users and credits
  # ---------------------------------------------------------------------------
  auth:
    build:
      context: ./backend
      dockerfile: services/auth/Dockerfile
    image: multiagent-auth:latest
    container_name: multiagent-auth
    restart: always
    environment:
      - PORT=8001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    networks:
      - multiagent-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Chat Service - conversations and messages
  # ---------------------------------------------------------------------------
  chat:
    build:
      context: ./backend
      dockerfile: services/chat/Dockerfile
    image: multiagent-chat:latest
    container_name: multiagent-chat
    restart: always
    environment:
      - PORT=8002
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
    networks:
      - multiagent-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Agent Service - LangGraph multi-agent orchestration and tool execution
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ./backend
      dockerfile: services/agent/Dockerfile
    image: multiagent-agent:latest
    container_name: multiagent-agent
    restart: always
    environment:
      - PORT=8003
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-nexora-platform}
    networks:
      - multiagent-net
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Billing Service - Razorpay orders, signature verification, plan activation
  # ---------------------------------------------------------------------------
  billing:
    build:
      context: ./backend
      dockerfile: services/billing/Dockerfile
    image: multiagent-billing:latest
    container_name: multiagent-billing
    restart: always
    environment:
      - PORT=8004
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth:8001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    networks:
      - multiagent-net
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # API Gateway - single entry point, CORS, session guard and service proxying
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    image: multiagent-gateway:latest
    container_name: multiagent-gateway
    restart: always
    environment:
      - PORT=8000
      - NODE_ENV=production
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - AGENT_SERVICE=http://agent:8003
      - BILLING_SERVICE=http://billing:8004
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - REDIS_URL=redis://redis:6379
    networks:
      - multiagent-net
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      agent:
        condition: service_healthy
      billing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend - Vite build served by Nginx, reverse proxies /api to the gateway
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
    image: multiagent-frontend:latest
    container_name: multiagent-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - multiagent-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  multiagent-net:
    driver: bridge
